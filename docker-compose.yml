name: raceops

x-raceops-environment: &raceops-environment
  RACEOPS_ENV: ${RACEOPS_ENV:-local}
  RACEOPS_LOG_LEVEL: ${RACEOPS_LOG_LEVEL:-INFO}
  RACEOPS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-raceops}:${POSTGRES_PASSWORD:-raceops}@db:5432/${POSTGRES_DB:-raceops}
  RACEOPS_DATABASE_CONNECT_TIMEOUT_SECONDS: ${RACEOPS_DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
  RACEOPS_JWT_SECRET: ${RACEOPS_JWT_SECRET:-local-development-only-change-me}

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raceops}
      POSTGRES_USER: ${POSTGRES_USER:-raceops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raceops}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql

  migrate:
    build:
      context: .
      target: runtime
    image: raceops-api:local
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *raceops-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    image: raceops-api:local
    init: true
    environment: *raceops-environment
    ports:
      - "127.0.0.1:${RACEOPS_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres_data:

