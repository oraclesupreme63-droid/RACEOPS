name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: raceops_test
          POSTGRES_USER: raceops
          POSTGRES_PASSWORD: raceops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raceops -d raceops_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      RACEOPS_ENV: test
      RACEOPS_DATABASE_URL: postgresql+psycopg://raceops:raceops@localhost:5432/raceops_test
      RACEOPS_DATABASE_CONNECT_TIMEOUT_SECONDS: "3"
      RACEOPS_JWT_SECRET: ci-test-secret-not-for-production
      RACEOPS_RUN_DB_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check src tests migrations

      - name: Lint
        run: python -m ruff check src tests migrations

      - name: Type check
        run: python -m mypy src tests

      - name: Run tests and enforce coverage
        run: >-
          python -m pytest
          --cov=raceops
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Verify ORM metadata matches migrations
        run: python -m alembic check

  container:
    name: Container smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: docker compose build api

      - name: Start complete stack
        run: docker compose up -d --wait

      - name: Verify HTTP endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/ready
          curl --fail --silent --show-error http://127.0.0.1:8000/openapi.json > /dev/null

      - name: Verify runtime image constraints
        run: |
          test "$(docker compose exec -T api id -u)" = "10001"
          docker compose exec -T api python -c "import importlib.util; assert importlib.util.find_spec('pytest') is None"
          docker compose exec -T api python -m alembic current

      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Remove ephemeral CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans
